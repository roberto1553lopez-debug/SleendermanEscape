
name: Construir APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.34

      - name: Aceptar licencia Android
        run: |
          sed -i 's/^# *android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec

      - name: Construir APK
        run: yes | buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SlendermanEscape-APK
          path: bin/*.apk
          
